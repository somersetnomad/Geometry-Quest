<title>Geometry Quest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: graph-paper field. Sticky HUD. Home = hero with guide + winding quest map + trophy shelf. World = colour banner, guide speech, illustrated labs, cheat sheet, challenge. */
:root{
  --paper:#F5F8FF; --grid:rgba(47,107,255,.07); --grid2:rgba(47,107,255,.14);
  --ink:#161B3A; --muted:#566089; --card:#FFFFFF; --stage:#F1F5FF; --line:#D6DFF2; --soft:#EAF0FF; --gridline:#DCE4F6;
  --c1:#FF3D7F; --c2:#2F6BFF; --c3:#FFB000; --c4:#00A88F; --c5:#7C4DFF;
  --good:#00976F; --bad:#E0334A; --onc:#13173A;
  --road:#30364F; --wood:#C8894B; --metal:#C3CCDD; --wall:#EBCDB3; --brick:#D9AE8C;
  --ff-display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --ff-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --ff-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0C1330; --grid:rgba(120,160,255,.06); --grid2:rgba(120,160,255,.11);
  --ink:#EDF1FF; --muted:#9CA8D2; --card:#141C40; --stage:#0F1736; --line:#29355F; --soft:#1A2450; --gridline:#1E2A55;
  --c1:#FF5C93; --c2:#5E8EFF; --c3:#FFC531; --c4:#22D3B2; --c5:#A485FF; --good:#2BD9A6; --bad:#FF5F73;
  --road:#283062; --wood:#B07A45; --metal:#8794B4; --wall:#4B3B49; --brick:#3B2E3A; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0C1330; --grid:rgba(120,160,255,.06); --grid2:rgba(120,160,255,.11);
  --ink:#EDF1FF; --muted:#9CA8D2; --card:#141C40; --stage:#0F1736; --line:#29355F; --soft:#1A2450; --gridline:#1E2A55;
  --c1:#FF5C93; --c2:#5E8EFF; --c3:#FFC531; --c4:#22D3B2; --c5:#A485FF; --good:#2BD9A6; --bad:#FF5F73;
  --road:#283062; --wood:#B07A45; --metal:#8794B4; --wall:#4B3B49; --brick:#3B2E3A; color-scheme:dark}

*{box-sizing:border-box}
body{background-color:var(--paper);color:var(--ink);font:400 17px/1.55 var(--ff-body);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px),linear-gradient(var(--grid2) 1px,transparent 1px),linear-gradient(90deg,var(--grid2) 1px,transparent 1px);
  background-size:24px 24px,24px 24px,120px 120px,120px 120px;padding-inline:clamp(16px,4vw,40px);min-height:100vh;overflow-x:hidden}
h1,h2,h3{font-family:var(--ff-display);text-wrap:balance;margin:0;line-height:1.05;letter-spacing:-.02em}
p{margin:0}
a{color:inherit}
.mono{font-family:var(--ff-mono);font-variant-numeric:tabular-nums}
.eyebrow{font:700 12px var(--ff-mono);text-transform:uppercase;letter-spacing:.14em;color:var(--muted)}
:focus-visible{outline:3px solid var(--c2);outline-offset:3px}
.view{animation:viewin .5s cubic-bezier(.2,.8,.2,1)}
@keyframes viewin{from{opacity:0;transform:translateY(16px)}}

/* HUD */
.hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;margin-inline:calc(-1*clamp(16px,4vw,40px));padding:10px clamp(16px,4vw,40px);display:flex;align-items:center;gap:16px;flex-wrap:wrap;background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1.5px solid var(--line)}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;font:800 20px var(--ff-display);letter-spacing:-.02em}
.logo svg{width:30px;height:30px}
.xp{display:flex;align-items:center;gap:10px;margin-left:auto;min-width:0}
.rank{font:700 13px var(--ff-mono);background:var(--ink);color:var(--paper);padding:4px 10px;border-radius:999px;white-space:nowrap}
.bar{width:clamp(80px,16vw,200px);height:12px;border-radius:99px;background:var(--soft);border:1.5px solid var(--ink);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--c1),var(--c3));transition:width .6s cubic-bezier(.2,.8,.2,1)}
.xpnum,.starcount{font:700 13px var(--ff-mono);white-space:nowrap}
.starcount b{color:var(--c3)}
.icon-btn{flex:none;white-space:nowrap;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 12px;font:700 13px var(--ff-body);cursor:pointer}
@media (max-width:560px){.bar,.xpnum{display:none}.logo span{font-size:17px}.hud{gap:10px}}

/* Buttons */
.btn{display:inline-flex;align-items:center;gap:8px;font:700 15px var(--ff-body);padding:10px 18px;border-radius:999px;border:2px solid var(--ink);background:var(--card);color:var(--ink);cursor:pointer;box-shadow:0 3px 0 var(--ink);transition:transform .12s cubic-bezier(.3,1.6,.5,1),box-shadow .12s;text-decoration:none;line-height:1.2}
.btn:hover{transform:translateY(-2px);box-shadow:0 5px 0 var(--ink)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.btn.primary{background:var(--c1);color:#fff}
.btn.on{background:var(--ink);color:var(--paper)}
.btn.ghost{border-color:transparent;box-shadow:none;background:transparent;text-decoration:underline;text-underline-offset:3px}
.btn.big{font-size:17px;padding:14px 24px}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}

/* Mascot + guide */
.mascot{display:block;width:100%;height:auto;overflow:visible}
.mascot .mb{animation:idle 3.2s ease-in-out infinite;transform-origin:60px 112px}
.mascot .me{animation:blink 4.6s infinite;transform-box:fill-box;transform-origin:center}
.mascot .halo{animation:halo 2.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes idle{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes halo{0%,100%{transform:scale(1);opacity:.9}50%{transform:scale(1.5);opacity:.4}}
.guide{display:grid;grid-template-columns:clamp(86px,15vw,140px) minmax(0,1fr);gap:clamp(12px,2vw,22px);align-items:end}
.bubble{position:relative;background:var(--card);border:2px solid var(--ink);border-radius:24px;padding:clamp(16px,2.5vw,24px);box-shadow:0 5px 0 var(--ink);display:grid;gap:14px;margin-bottom:22px}
.bubble::before{content:"";position:absolute;left:-12px;bottom:28px;width:20px;height:20px;background:var(--card);border-left:2px solid var(--ink);border-bottom:2px solid var(--ink);transform:rotate(45deg)}
.g-text{font:700 clamp(19px,2.6vw,26px)/1.3 var(--ff-display);letter-spacing:-.01em}
.g-text .w{display:inline-block;animation:word .4s both cubic-bezier(.2,.8,.2,1)}
@keyframes word{from{opacity:0;transform:translateY(6px)}}
.g-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.g-dots{display:flex;gap:6px}
.g-dots i{width:9px;height:9px;border-radius:50%;background:var(--line)}
.g-dots i.on{background:var(--c1);width:24px;border-radius:9px}
.g-name{font:700 12px var(--ff-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--c1)}

/* Home */
.hero{display:grid;grid-template-columns:1.05fr .95fr;gap:clamp(20px,4vw,56px);align-items:center;max-width:1180px;margin:0 auto;padding-block:clamp(28px,6vw,60px) 20px}
.hero>div{min-width:0}
.hero h1{font-size:clamp(42px,7vw,86px);font-weight:800;line-height:.95;margin-block:14px 18px}
.hero h1 em{font-style:normal;background:linear-gradient(transparent 58%,color-mix(in srgb,var(--c3) 70%,transparent) 58%);padding-inline:.06em}
.hero .lede{font-size:clamp(17px,2vw,20px);max-width:36ch;color:var(--muted)}
.hero .cta{display:flex;flex-wrap:wrap;gap:12px;margin-top:24px}
.hero .facts{display:flex;flex-wrap:wrap;gap:8px 20px;margin-top:22px;font:700 13px var(--ff-mono);color:var(--muted)}
.hero .facts b{color:var(--ink);font-size:18px}
.hero-art{position:relative;background:var(--card);border:2px solid var(--ink);border-radius:28px;box-shadow:0 8px 0 var(--ink);padding:10px;aspect-ratio:480/430;max-width:100%}
.hero-art>svg.construct{width:100%;height:100%;display:block}
.hero-art .cap{position:absolute;right:18px;top:14px;font:700 11px var(--ff-mono);color:var(--muted);letter-spacing:.08em}
.hero-art .hm{position:absolute;left:-26px;bottom:-30px;width:clamp(96px,24%,140px)}
.hero-art .hb{position:absolute;left:calc(clamp(96px,24%,140px) - 18px);bottom:46px;background:var(--ink);color:var(--paper);font:800 15px var(--ff-display);padding:9px 14px;border-radius:16px 16px 16px 4px;max-width:60%}
.hero-art svg.float{position:absolute;width:44px;height:44px;animation:bob 5s ease-in-out infinite}
.float.f1{top:-18px;right:30px;animation-delay:-1s}
.float.f2{bottom:60px;right:-20px;animation-delay:-2.5s}
@keyframes bob{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-12px) rotate(18deg)}}
.hA,.hCA,.hCB,.hS{stroke-dasharray:1;stroke-dashoffset:0}
.hA{animation:hAB 9s infinite}.hCA{animation:hCA 9s linear infinite}.hCB{animation:hCB 9s linear infinite}.hS{animation:hS 9s infinite}
.hP{animation:hP 9s infinite}.hF{animation:hF 9s infinite}.hG{animation:hG 9s infinite}
@keyframes hAB{0%{stroke-dashoffset:1}10%,100%{stroke-dashoffset:0}}
@keyframes hCA{0%,10%{stroke-dashoffset:1}33%,100%{stroke-dashoffset:0}}
@keyframes hCB{0%,33%{stroke-dashoffset:1}56%,100%{stroke-dashoffset:0}}
@keyframes hP{0%,56%{opacity:0}61%,100%{opacity:1}}
@keyframes hS{0%,61%{stroke-dashoffset:1}76%,100%{stroke-dashoffset:0}}
@keyframes hF{0%,76%{opacity:0}84%,100%{opacity:1}}
@keyframes hG{0%,90%{opacity:1}97%,100%{opacity:0}}

.section{max-width:1180px;margin:0 auto;padding-block:36px 30px}
.sec-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:end;gap:12px;margin-bottom:22px}
.sec-head h2{font-size:clamp(30px,4.4vw,48px)}
.sec-head p{color:var(--muted);max-width:46ch}

/* Quest map */
.quest{position:relative;min-height:400px}
.quest-svg{position:absolute;left:0;top:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.qp-base{fill:none;stroke:var(--line);stroke-width:16;stroke-linecap:round}
.qp-done{fill:none;stroke:var(--c3);stroke-width:16;stroke-linecap:round}
.qp-dash{fill:none;stroke:var(--ink);stroke-width:2.5;stroke-dasharray:3 11;stroke-linecap:round;opacity:.5}
.node{position:absolute;width:156px;transform:translate(-50%,-50px);display:grid;justify-items:center;gap:8px;text-decoration:none;color:var(--ink);background:none;border:0;cursor:pointer;font:inherit;padding:0}
.disc{width:100px;height:100px;border-radius:50%;background:var(--wc);border:3px solid var(--ink);box-shadow:0 7px 0 var(--ink);display:grid;place-items:center;position:relative;transition:transform .25s cubic-bezier(.3,1.7,.5,1)}
.node:hover .disc,.node:focus-visible .disc{transform:translateY(-5px) scale(1.07) rotate(-3deg)}
.disc svg{width:54px;height:54px;fill:none;stroke:var(--onc);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.disc svg .gf{fill:var(--onc)}
.disc .num{position:absolute;top:-8px;right:-10px;width:34px;height:34px;border-radius:50%;background:var(--ink);color:var(--paper);font:800 14px/34px var(--ff-mono);text-align:center}
.node .nt{font:800 17px/1.1 var(--ff-display);text-align:center;background:var(--paper);padding:3px 9px;border-radius:9px}
.node .stars{font-size:16px}
.node.locked .disc{background:var(--soft);box-shadow:0 7px 0 var(--line);border-color:var(--line)}
.node.locked .disc svg{stroke:var(--muted);opacity:.35}
.node.locked .nt{color:var(--muted)}
.lock{position:absolute;inset:0;display:grid;place-items:center}
.lock svg{width:34px;height:34px;stroke:var(--muted);opacity:1;stroke-width:3}
.node.current .disc{animation:glow 1.8s infinite}
@keyframes glow{0%{box-shadow:0 7px 0 var(--ink),0 0 0 0 color-mix(in srgb,var(--c1) 55%,transparent)}70%{box-shadow:0 7px 0 var(--ink),0 0 0 18px transparent}100%{box-shadow:0 7px 0 var(--ink),0 0 0 0 transparent}}
.here{position:absolute;width:66px;pointer-events:none;transition:left .6s,top .6s}
.here .tag{position:absolute;left:50%;top:-22px;transform:translateX(-50%);background:var(--c1);color:#fff;font:800 11px var(--ff-mono);padding:2px 8px;border-radius:99px;white-space:nowrap;letter-spacing:.06em}
.boss-strip{max-width:1180px;margin:10px auto 10px;background:var(--ink);color:var(--paper);border-radius:26px;padding:clamp(20px,4vw,34px);display:flex;flex-wrap:wrap;gap:18px;align-items:center;justify-content:space-between}
.boss-strip h2{font-size:clamp(28px,4vw,42px)}
.boss-strip p{opacity:.8;max-width:50ch}
.boss-strip .btn{border-color:var(--paper);box-shadow:0 3px 0 var(--paper)}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:18px}
.badge{display:grid;justify-items:center;text-align:center;gap:6px}
.medal{width:76px;height:76px;border-radius:50%;border:3px solid var(--ink);background:var(--bc);display:grid;place-items:center;box-shadow:0 5px 0 var(--ink);position:relative}
.medal::after{content:"";position:absolute;inset:6px;border-radius:50%;border:2px dashed color-mix(in srgb,var(--onc) 35%,transparent)}
.medal svg{width:38px;height:38px;fill:none;stroke:var(--onc);stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round}
.medal svg .gf{fill:var(--onc)}
.badge b{font:800 15px/1.15 var(--ff-display)}
.badge span{font-size:13px;color:var(--muted);line-height:1.3}
.badge.off .medal{background:var(--soft);border-color:var(--line);box-shadow:none}
.badge.off .medal svg{stroke:var(--muted);opacity:.45}
.badge.off .medal svg .gf{fill:var(--muted)}
.badge.off b{color:var(--muted)}
footer{max-width:1180px;margin:30px auto 0;padding-block:20px 50px;color:var(--muted);font-size:13px;border-top:1.5px solid var(--line);display:flex;gap:12px;flex-wrap:wrap;justify-content:space-between}

/* World page */
.world{max-width:1000px;margin:0 auto;display:grid;gap:30px;padding-block:22px 80px}
.back{font:700 14px var(--ff-mono);text-decoration:none;color:var(--muted)}
.back:hover{color:var(--ink)}
.banner{background:var(--wc);color:var(--onc);border:2px solid var(--ink);border-radius:30px;box-shadow:0 7px 0 var(--ink);padding:clamp(22px,4vw,40px);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:18px;align-items:center;position:relative;overflow:hidden;
  background-image:radial-gradient(rgba(19,23,58,.14) 1.6px,transparent 1.8px);background-size:20px 20px}
.banner .wnum{font:800 13px var(--ff-mono);letter-spacing:.14em;text-transform:uppercase;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.banner .wnum .stars{font-size:18px;letter-spacing:2px}
.banner .wnum .stars,.banner .wnum .stars .off{color:var(--onc)}
.banner .wnum .stars .off{opacity:.25}
.banner h1{font-size:clamp(46px,9vw,100px);font-weight:800;margin-block:10px 8px;color:var(--onc)}
.banner .w-tag{font-size:clamp(18px,2.2vw,22px);font-weight:700;opacity:.8}
.banner .art{width:clamp(90px,20vw,190px);height:auto;fill:none;stroke:var(--onc);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;transform:rotate(-8deg);animation:spin-in .9s cubic-bezier(.3,1.5,.5,1)}
.banner .art .gf{fill:var(--onc)}
@keyframes spin-in{from{transform:rotate(-60deg) scale(.6)}}
.sec-title{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.sec-title h2{font-size:clamp(28px,4vw,40px)}
.sec-title span{color:var(--muted)}
.labs{display:grid;gap:24px}
.lab{background:var(--card);border:2px solid var(--ink);border-radius:26px;padding:clamp(14px,3vw,24px);display:grid;gap:14px;box-shadow:0 6px 0 var(--ink);min-width:0}
.lab-head{display:flex;justify-content:space-between;align-items:start;gap:12px;flex-wrap:wrap}
.lab-head h3{font-size:clamp(22px,3vw,30px)}
.lab-head p{color:var(--muted);margin-top:4px;max-width:62ch}
.lab-tag{font:700 11px var(--ff-mono);letter-spacing:.12em;text-transform:uppercase;background:var(--soft);color:var(--muted);padding:5px 10px;border-radius:99px;white-space:nowrap}
.stage{width:100%;height:auto;display:block;background:var(--stage);border-radius:18px;border:1.5px solid var(--line);user-select:none;-webkit-user-select:none}
.readout{font-size:16px;line-height:1.6;background:var(--soft);border-radius:14px;padding:12px 16px;min-height:3.2em;overflow-wrap:anywhere}
.good{color:var(--good)} .bad{color:var(--bad)}
.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.slider{display:flex;align-items:center;gap:10px;font-weight:700;flex:1 1 220px;min-width:0}
.slider span{white-space:nowrap}
.slider input{flex:1;min-width:0;accent-color:var(--c1);height:28px}
.slider output{font:700 15px var(--ff-mono);min-width:3ch;text-align:right}
.pill{display:inline-block;padding:2px 10px;border-radius:999px;background:var(--ink);color:var(--paper);font:700 13px var(--ff-mono);margin:0 6px 4px 0;vertical-align:middle}
.pill.c{background:var(--pc);color:var(--onc)}
.sw{display:inline-block;width:12px;height:12px;border-radius:3px;background:var(--pc);margin-right:6px;vertical-align:-1px;border:1.5px solid var(--ink)}
.ol{text-decoration:overline;font-family:var(--ff-mono);font-weight:700}
.arr{position:relative;display:inline-block;font-family:var(--ff-mono);font-weight:700;padding-top:.5em}
.arr::before{content:attr(data-a);position:absolute;top:-.25em;left:0;right:0;text-align:center;font-size:.85em;line-height:1}
.life{display:inline-block;margin-top:6px;font-weight:700}
.life::before{content:"Spot it IRL: ";font:700 12px var(--ff-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--c1)}
.seg{display:inline-flex;border:2px solid var(--ink);border-radius:999px;overflow:hidden;flex-wrap:wrap}
.seg button{border:0;background:var(--card);color:var(--ink);font:700 14px var(--ff-body);padding:9px 14px;cursor:pointer}
.seg button+button{border-left:2px solid var(--ink)}
.seg button.on{background:var(--ink);color:var(--paper)}
@media (max-width:560px){.seg button{padding:8px 10px;font-size:13px}}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip-btn{border:1.5px solid var(--line);background:var(--soft);color:var(--ink);border-radius:999px;padding:7px 13px;font:700 13px var(--ff-body);cursor:pointer;transition:transform .15s}
.chip-btn:hover{border-color:var(--ink);transform:translateY(-1px)}
.chip-btn b{font-family:var(--ff-mono);color:var(--c1)}
.canvas-wrap{width:100%;border-radius:18px;overflow:hidden;border:1.5px solid var(--line);background:var(--stage)}
canvas.sym{display:block;width:100%;touch-action:none;cursor:crosshair}
.steps{display:grid;gap:10px;counter-reset:st}
.stepcard{background:var(--soft);border-radius:14px;padding:12px 16px 12px 52px;position:relative;animation:pop .35s ease}
.stepcard::before{counter-increment:st;content:counter(st);position:absolute;left:14px;top:11px;width:26px;height:26px;border-radius:50%;background:var(--ink);color:var(--paper);font:700 13px/26px var(--ff-mono);text-align:center}
.stepcard.last{background:color-mix(in srgb,var(--c4) 22%,var(--card))}
@keyframes pop{from{transform:translateY(8px) scale(.98);opacity:.3}to{transform:none;opacity:1}}

/* SVG parts */
.s-main{stroke:var(--c2);stroke-width:4;stroke-linecap:round;fill:none}
.s-line{stroke:var(--ink);stroke-width:3;stroke-linecap:round;fill:none}
.s-rail{stroke:var(--ink);stroke-width:5;stroke-linecap:round}
.s-faint{stroke:var(--line);stroke-width:2;stroke-dasharray:4 6;fill:none}
.s-guide{stroke:var(--c3);stroke-width:2.5;stroke-dasharray:7 7}
.s-dash{stroke:var(--muted);stroke-width:2;stroke-dasharray:6 6;fill:none}
.s-arm{stroke:var(--ink);stroke-width:5;stroke-linecap:round}
.s-c1{stroke:var(--c1);stroke-width:2.5;fill:none}
.s-c2{stroke:var(--c2);stroke-width:2.5;fill:none}
.s-hl1{stroke:var(--c1);stroke-width:8;stroke-linecap:round;fill:none}
.s-hl2{stroke:var(--c4);stroke-width:8;stroke-linecap:round;fill:none}

function angSpan(V,P,Q){const a=mathAng(V,P),b=mathAng(V,Q);const d=((b-a)%360+360)%360;return d>180?[b,b+360-d]:[a,a+d];}

function loadPic(file,after){if(!file||!/^image\//.test(file.type)){toast('Please choose a picture file (JPG or PNG).');return;}

  img.onload=()=>{const N=260,c=document.createElement('canvas');c.width=c.height=N;const x=c.getContext('2d');x.fillStyle=buddy().color;x.fillRect(0,0,N,N);const k=Math.max(N/img.width,N/img.height),w=img.width*k,h=img.height*k;x.drawImage(img,(N-w)/2,(N-h)/2,w,h);URL.revokeObjectURL(url);
    const data=c.toDataURL('image/jpeg',.85);S.buddy=Object.assign(buddy(),{image:data,zoom:1});let ok=true;try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){ok=false;}
    toast(ok?'Picture added to your guide':'Picture added, but this browser can’t save it. It will reset when you close the page.');sfx('win');updateHUD();route();};
  img.onerror=()=>{URL.revokeObjectURL(url);toast('Couldn’t read that picture. Try a JPG or PNG.');};img.src=url;}

function wordify(t){return t.split(' ').map((w,i)=>`<span class="w" style="animation-delay:${i*35}ms">${w}</span>`).join(' ');}
function guide(parent,lines,endFn){
  const w=H('div',{class:'guide'},null,parent);const m=H('div',{},mascot('wow'),w);const b=H('div',{class:'bubble'},null,w);let i=0;
  function show(){b.innerHTML=`<span class="g-name">${buddyName()} says</span><p class="g-text">${wordify(lines[i].replace('{name}',S.name||'friend'))}</p><div class="g-foot"><span class="g-dots">${lines.map((_,k)=>`<i class="${k===i?'on':''}"></i>`).join('')}</span><span class="g-act"></span></div>`;
    const act=$('.g-act',b);if(i<lines.length-1){btn(act,'Next →',()=>{i++;show();},'primary');}else if(endFn){endFn(act);}
    m.innerHTML=mascot(i===0?'wow':i===lines.length-1?'cheer':'happy');}
  show();return {mood:md=>m.innerHTML=mascot(md)};}

function labTransform(root,pid){
  const p=panel(root,'Shape mover','Slide it, flip it, spin it. The image is always the same size and shape.','Lab');
  const N=7,U=28,O=210,s=stage(p,420,420,'Transformations on a grid');s.style.maxWidth='540px';s.style.marginInline='auto';gridLayer(s,N,U,O);
  const guideG=E('g',{},s);const OBJ=[[1,1],[1,4],[2,4],[2,2],[3,2],[3,1]];const X=v=>O+v*U,Y=v=>O-v*U;
  const obj=E('polygon',{points:OBJ.map(([a,b])=>`${X(a)},${Y(b)}`).join(' '),fill:'var(--c2)','fill-opacity':.35,stroke:'var(--c2)','stroke-width':3,'stroke-linejoin':'round'},s);
  const img=E('polygon',{fill:'var(--c1)','fill-opacity':.35,stroke:'var(--c1)','stroke-width':3,'stroke-linejoin':'round'},s);
  const aL=E('text',{class:'t-name',x:X(1)-22,y:Y(4)-6},s);aL.textContent='A';const bL=E('text',{class:'t-name'},s);
  const ct=controls(p);const sub=H('div',{class:'controls'},null,p);const r=readout(p);let mode='translate',busy=false,dx=3,dy=-5;const did=new Set();
  const fmt=([a,b])=>`(${Math.round(a)}, ${Math.round(b)})`.replace(/-/g,'−');
  function apply(kind,label,rule,fn,interp){if(busy)return;busy=true;guideG.innerHTML='';const fin=OBJ.map(fn);
    if(kind==='translate'){const [a,b]=OBJ[1],[c,d]=fin[1];E('line',{x1:X(a),y1:Y(b),x2:X(c),y2:Y(d),class:'s-guide'},guideG);}
    if(kind==='rotate'){E('circle',{cx:O,cy:O,r:6,fill:'var(--c1)'},guideG);}
    if(kind==='reflect'){const L={y:[[0,-N],[0,N]],x:[[-N,0],[N,0]],yx:[[-N,-N],[N,N]]}[label];E('line',{x1:X(L[0][0]),y1:Y(L[0][1]),x2:X(L[1][0]),y2:Y(L[1][1]),stroke:'var(--c1)','stroke-width':3,'stroke-dasharray':'8 6'},guideG);}
    tween(1100,t=>{const pts=OBJ.map((q,i)=>interp(q,fin[i],t));img.setAttribute('points',pts.map(([a,b])=>`${X(a)},${Y(b)}`).join(' '));bL.setAttribute('x',X(pts[1][0])+6);bL.setAttribute('y',Y(pts[1][1])-6);bL.textContent='A′';},
      ()=>{busy=false;did.add(kind);if(did.size===3)award('transformer');sfx('ok');r.innerHTML=`${rule}<br><span class="mono">A(1, 4) → A′${fmt(fin[1])}</span>`;});}
  const lerpP=(a,b,t)=>[lerp(a[0],b[0],t),lerp(a[1],b[1],t)];
  const rotP=deg=>(a,b,t)=>{const th=deg*t*Math.PI/180,c=Math.cos(th),s2=Math.sin(th);return [a[0]*c-a[1]*s2,a[0]*s2+a[1]*c];};
  function tools(){sub.innerHTML='';
    if(mode==='translate'){slider(sub,pid+'-dx','Right/left',-8,4,dx,1,v=>dx=v);slider(sub,pid+'-dy','Up/down',-8,3,dy,1,v=>dy=v);
      btn(sub,'Slide it',()=>apply('translate','','<b>Translation</b>: every point slides the same distance. (x, y) → (x '+(dx<0?'− '+(-dx):'+ '+dx)+', y '+(dy<0?'− '+(-dy):'+ '+dy)+')',([a,b])=>[a+dx,b+dy],lerpP),'primary');}
    if(mode==='reflect'){[['y','in the y-axis','(x, y) → (−x, y)',([a,b])=>[-a,b]],['x','in the x-axis','(x, y) → (x, −y)',([a,b])=>[a,-b]],['yx','in the line y = x','(x, y) → (y, x)',([a,b])=>[b,a]]].forEach(([k,l,rule,fn])=>btn(sub,'Reflect '+l,()=>apply('reflect',k,`<b>Reflection ${l}</b>: like a mirror. ${rule}`,fn,lerpP)));}
    if(mode==='rotate'){[['90° clockwise',-90,'(x, y) → (y, −x)',([a,b])=>[b,-a]],['180°',180,'(x, y) → (−x, −y)',([a,b])=>[-a,-b]],['90° anticlockwise',90,'(x, y) → (−y, x)',([a,b])=>[-b,a]]].forEach(([l,deg,rule,fn])=>btn(sub,'Rotate '+l,()=>apply('rotate','',`<b>Rotation ${l}</b> about the origin O. ${rule}`,fn,rotP(deg))));}
    r.innerHTML={translate:'Set a slide, then press <b>Slide it</b>. A game character walking is a translation.',reflect:'Pick a mirror line. Your reflection in a mirror is flipped left to right.',rotate:'Spin about the origin O. Clock hands and fidget spinners rotate.'}[mode];}
  segmented(ct,[['translate','Translate (slide)'],['reflect','Reflect (flip)'],['rotate','Rotate (spin)']],mode,k=>{mode=k;tools();});
  tools();
}

function whyHome(app){const sec=H('section',{class:'section'},`<div class="sec-head"><div><span class="eyebrow">Why learn this?</span><h2>Geometry is everywhere</h2></div><p>Geometry is the maths of shape, size, position and movement. It’s how people design, build, navigate and create.</p></div>`,app);
  H('div',{class:'whygrid'},WHY_HOME.map(([t,d,g])=>`<div class="whycard"><svg viewBox="0 0 40 40" aria-hidden="true">${GLYPH[g]}</svg><h3>${t}</h3><p>${d}</p></div>`).join(''),sec);
  const how=H('section',{class:'section'},`<div class="sec-head"><div><span class="eyebrow">How it works</span><h2>Every world, five steps</h2></div><p>New here? The <a href="#help">Start here guide</a> explains everything for learners and grown-ups.</p></div>`,app);stepStrip(how);}
function renderHelp(app){
  const wrap=H('div',{class:'world'},null,app);H('a',{href:'#',class:'back'},'← Back to the map',wrap);
  H('header',{class:'banner',style:'--wc:var(--c3)'},`<div><div class="wnum"><span>Start here</span></div><h1>How Geometry Quest works</h1><p class="w-tag">What this is, why it matters, and how to use it.</p></div><div class="rm">${mascot('happy')}</div>`,wrap);
  const t=(h,body,id)=>H('section',{class:'lab helpsec',id:id||''},`<div class="lab-head"><div><h3>${h}</h3></div></div>${body}`,wrap);
  t('What is this?',`<p>Geometry Quest is a course in <b>geometry</b>: the maths of shapes, angles, sizes, positions and movement. There are 16 worlds. They start with the simplest idea, a single point, and build up step by step to Pythagoras and fractals. Each world takes about 30 to 60 minutes.</p>`);
  t('Why learn geometry?',`<p>You use geometry every day without noticing: judging a gap to cross the road, packing a bag, aiming a ball. People who design, build and create use it all the time.</p><div class="whygrid" style="margin-top:14px">${WHY_HOME.map(([a,d,g])=>`<div class="whycard"><svg viewBox="0 0 40 40" aria-hidden="true">${GLYPH[g]}</svg><h3>${a}</h3><p>${d}</p></div>`).join('')}</div><p style="margin-top:14px">It’s also in every maths exam, from SATs to GCSE, and it trains careful, step-by-step thinking.</p>`);
  const hw=t('How each world works',`<p>Every world follows the same five steps, so you always know what comes next.</p>`);stepStrip(hw);
  t('How to use the labs',`<ul class="helplist"><li><b>Glowing pink or blue dots</b> are handles. Press and drag them.</li><li><b>Sliders</b> change a number. Drag them left and right.</li><li><b>Buttons</b> start animations or games. Try them all: nothing can break.</li><li>The <b>grey box under each lab</b> explains what you’re seeing as you change things.</li><li>On a keyboard, press Tab to reach a handle, then use the arrow keys.</li></ul>`);
  t('Stars, XP and badges',`<ul class="helplist"><li><b>Stars:</b> each challenge has 5 questions. 5 right = 3 stars, 4 = 2 stars, 3 = 1 star. Try again as often as you like: your best counts.</li><li><b>Unlocking:</b> earn at least 1 star to unlock the next world. Grown-ups can switch on <b>Explore mode</b> on the map to open everything.</li><li><b>XP</b> comes from right answers and games, and raises your rank from Dot to Euclid’s Rival.</li><li><b>Badges</b> are hidden around the labs. Explore to find them.</li><li><b>Your guide:</b> tap the little face at the top of the screen to design your own guide, or change it any time.</li></ul>`);
  t('For parents and carers',`<ul class="helplist"><li><b>Suggested rhythm:</b> one world a week. Day 1: the guide’s intro and the labs. Day 2: the worksheet. Day 3: the challenge and the cheat sheet.</li><li><b>Ages:</b> worlds 1 to 12 suit most 9 to 11-year-olds. Worlds 13 to 15 are secondary level (KS3 to GCSE). World 16 is enrichment for anyone curious.</li><li><b>Worksheets:</b> each world has one, plus a separate answer sheet. Print at 100% (“actual size”) so measuring works with a real ruler and protractor.</li><li><b>Progress:</b> the <a href="#report">Report</a> page shows stars, scores and dates for each world, a summary for your records, and a <b>progress code</b> you can type on another device to carry on there.</li><li><b>Privacy:</b> no accounts and no tracking. Progress stays in this browser.</li></ul>`);
  t('Stuck?',`<ul class="helplist"><li><b>Don’t understand a lab?</b> Read the grey box under it, then try the example buttons.</li><li><b>Got a question wrong?</b> The explanation shows the trick. Play the matching lab again, then retry.</li><li><b>Progress gone?</b> Clearing browser data erases it. Use the progress code on the Report page to bring it back.</li><li><b>Too noisy?</b> Turn the sound off with the button at the top.</li></ul><div class="controls" style="margin-top:14px"><a class="btn primary" href="#w1">Start World 1 →</a><a class="btn" href="#">See the map</a></div>`);
}

function onboard(){
  const back=H('div',{class:'modal-back',role:'dialog','aria-modal':'true','aria-labelledby':'ob-t'},null,document.body);
  const m=H('div',{class:'modal'},`<div class="mm">${mascot('cheer')}</div><h2 id="ob-t">Hi! I’m ${buddyName()}.</h2><p>I’ll be your guide through 16 worlds of shapes, spins and secrets. What should I call you?</p>`,back);
  const inp=H('input',{type:'text',id:'ob-name',maxlength:'20',placeholder:'Your first name or a nickname',autocomplete:'off'},null,m);const c=H('div',{class:'controls'},null,m);
  const go=()=>{S.name=inp.value.trim().slice(0,20);S.seen=true;save();route();burst(innerWidth/2,innerHeight/3,90);sfx('win');plan();};
  const plan=()=>{m.innerHTML=`<div class="mm">${mascot('happy')}</div><h2>Here’s the plan${S.name?', '+S.name:''}!</h2><ol><li><b>What?</b> Geometry is the maths of shapes, angles, sizes and movement.</li><li><b>Why?</b> Builders, game designers, pilots, artists and sports stars use it every day. It’s in every maths exam too.</li><li><b>How?</b> 16 worlds. In each one: meet the idea, play the labs, practise on paper, then take a 5-question challenge for stars.</li><li><b>Stuck?</b> Tap <b>Help</b> at the top any time.</li><li><b>Your guide:</b> tap the little face at the top to redesign me: shape, colour, eyes and hats.</li></ol><div class="controls"></div>`;
    const c2=$('.controls',m);H('a',{class:'btn primary big',href:'#w1'},'Start World 1 →',c2).addEventListener('click',()=>back.remove());H('a',{class:'btn',href:'#buddy'},'Design my own guide',c2).addEventListener('click',()=>back.remove());btn(c2,'Show me the map',()=>back.remove(),'ghost');};
  btn(c,'Let’s go!',go,'primary big');btn(c,'Skip',()=>{S.seen=true;save();back.remove();},'ghost');inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();go();}});setTimeout(()=>inp.focus(),100);
}
function route(){const h=location.hash.slice(1);const app=$('#app');app.innerHTML='';window.scrollTo(0,0);const v=H('div',{class:'view'},null,app);
  if(/^w\d+$/.test(h)){const i=+h.slice(1)-1;if(WORLDS[i])return renderWorld(v,i);}
  if(h==='buddy')return renderBuddy(v);
  if(h==='boss')return renderBoss(v);if(h==='report')return renderReport(v);if(h==='help')return renderHelp(v);renderHome(v);}
addEventListener('hashchange',route);
updateHUD();route();if(!S.seen)onboard();
</script>
